<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="Reto Mates">
<meta name="application-name" content="Reto Mates">
<meta name="theme-color" content="#2f80ed">
<style>
:root{
  --bg1:#5b4bdb;--bg2:#2fb5e8;--ink:#1f2340;--muted:#6b7090;--card:#ffffff;
  --ok:#1fb57a;--bad:#e5484d;--gold:#f5b70a;--silver:#a9b4c2;--bronze:#d08a4c;
  --violet:#7c5cff;--pink:#ff5fa2;--orange:#ff9f1c;--teal:#14b8a6;--blue:#3b82f6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink)}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;
  background-image:radial-gradient(circle at 20% 30%,#fff 2px,transparent 3px),radial-gradient(circle at 70% 60%,#fff 2px,transparent 3px),radial-gradient(circle at 40% 80%,#fff 1.5px,transparent 2.5px);
  background-size:120px 120px,170px 170px,90px 90px}
button{font-family:inherit;cursor:pointer;border:none}
input{font-family:inherit}
.wrap{max-width:920px;margin:0 auto;padding:16px 16px 40px;position:relative}
.card{background:var(--card);border-radius:26px;box-shadow:0 14px 40px rgba(20,20,60,.25);padding:24px}
.hidden{display:none!important}
h1,h2,h3{margin:.2em 0}
.center{text-align:center}
.muted{color:var(--muted)}
.big{font-size:1.25rem}

/* ---------- inicio ---------- */
.logo{display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;margin:10px 0 18px}
img.eco{display:block;object-fit:contain;pointer-events:none;user-select:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
img.eco.lg{height:96px;width:auto;animation:bob 3s ease-in-out infinite}
img.eco.tr{height:120px;width:auto;margin:4px auto 6px}
.medrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:24px}.medrow .medalwrap{margin:0}
.ecores{display:flex;flex-direction:column;align-items:center}
img.eco.res{height:180px;width:auto;animation:slideIn .6s ease both .5s}
.animo{font-weight:900;font-size:1.4rem;color:#1fb57a}
@media(max-width:560px){img.eco.res{height:130px}.medrow{flex-direction:column}.ecores{margin-top:16px}}
.cole{background:#fff;border-radius:18px;padding:8px 18px;width:max-content;max-width:90%;margin:6px auto 0;box-shadow:0 6px 18px rgba(0,40,90,.18)}.cole img{display:block;height:64px;width:auto;max-width:100%;object-fit:contain}
.logo .b{font-size:3rem;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));animation:bob 3s ease-in-out infinite}
.logo h1{font-size:2.6rem;font-weight:900;letter-spacing:.5px;text-shadow:0 4px 12px rgba(0,0,0,.25)}
.field{margin:12px 0}
.field label{display:block;font-weight:800;margin-bottom:6px}
.field input{width:100%;font-size:1.2rem;padding:14px 16px;border-radius:16px;border:3px solid #e3e6f3;outline:none;transition:.2s}
.field input:focus{border-color:var(--violet)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:flex;gap:10px}
.seg button{flex:1;font-size:1.3rem;font-weight:900;padding:14px;border-radius:16px;background:#eef0fa;color:var(--ink);border:3px solid transparent}
.seg button.on{background:#efe9ff;border-color:var(--violet);color:var(--violet)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:1.25rem;font-weight:900;padding:16px 26px;border-radius:18px;color:#fff;background:linear-gradient(135deg,var(--violet),var(--pink));box-shadow:0 8px 0 #4b33b8,0 12px 20px rgba(0,0,0,.2);transition:transform .1s}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 #4b33b8}
.btn.green{background:linear-gradient(135deg,#22c55e,#14b8a6);box-shadow:0 8px 0 #0f8a63,0 12px 20px rgba(0,0,0,.2)}
.btn.gold{background:linear-gradient(135deg,#ffd43b,#ff9f1c);color:#5a3600;box-shadow:0 8px 0 #c26d00,0 12px 20px rgba(0,0,0,.2)}
.btn.gray{background:#eef0fa;color:var(--ink);box-shadow:0 6px 0 #cfd3e6}
.btn.small{font-size:1rem;padding:10px 16px;box-shadow:0 5px 0 #4b33b8}
.btn.gray.small{box-shadow:0 5px 0 #cfd3e6}
.btn:disabled{opacity:.45;pointer-events:none}
.full{width:100%}
.err{color:var(--bad);font-weight:800;min-height:1.4em;margin-top:8px}
.shake{animation:shake .4s}
.teacher-link{display:block;margin:18px auto 0;color:#fff;opacity:.85;background:none;font-weight:700;text-decoration:underline;font-size:.95rem}
.banner{background:#fff6d6;border:2px dashed var(--orange);border-radius:16px;padding:10px 14px;font-weight:800;margin-bottom:14px;text-align:center}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:12px;gap:10px}
.phase{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.25rem;text-shadow:0 2px 6px rgba(0,0,0,.25)}
.phase .ic{font-size:1.8rem}
.chip{background:rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;font-weight:800;backdrop-filter:blur(4px);white-space:nowrap}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 14px}
.dots span{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots span.done{background:#fff}
.dots span.cur{background:var(--gold);transform:scale(1.3);box-shadow:0 0 0 3px rgba(255,255,255,.5)}
.dots span.gap{width:6px;background:transparent}

/* ---------- cálculo: globos ---------- */
.qcard{text-align:center;padding:26px 18px}
.qtext{font-size:clamp(1.8rem,6vw,3rem);font-weight:900;line-height:1.2}
.qsub{font-size:1.15rem;color:var(--muted);font-weight:700;margin-bottom:6px}
.balloons{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:26px;min-height:220px;align-items:end}
@media (max-width:600px){.balloons{grid-template-columns:repeat(3,1fr);row-gap:40px}}
.balloon{position:relative;justify-self:center;width:min(140px,17vw,30vw);height:min(160px,20vw,35vw);min-width:96px;min-height:110px;border-radius:50% 50% 48% 48%/58% 58% 42% 42%;
  display:flex;align-items:center;justify-content:center;font-size:clamp(1.2rem,3.6vw,1.8rem);font-weight:900;color:#fff;
  text-shadow:0 2px 4px rgba(0,0,0,.25);box-shadow:inset -14px -18px 0 rgba(0,0,0,.12),inset 12px 12px 0 rgba(255,255,255,.18);animation:bob 2.6s ease-in-out infinite;padding:8px}
.balloon::after{content:"";position:absolute;bottom:-26px;left:50%;width:2px;height:28px;background:rgba(255,255,255,.8)}
.balloon::before{content:"";position:absolute;bottom:-6px;left:calc(50% - 7px);border:7px solid transparent;border-bottom:8px solid currentColor}
.balloon:nth-child(1){background:var(--pink);color:var(--pink);animation-delay:-.2s}
.balloon:nth-child(2){background:var(--orange);color:var(--orange);animation-delay:-1.1s}
.balloon:nth-child(3){background:var(--teal);color:var(--teal);animation-delay:-.6s}
.balloon:nth-child(4){background:var(--blue);color:var(--blue);animation-delay:-1.8s}
.balloon:nth-child(5){background:var(--violet);color:var(--violet);animation-delay:-2.3s}
.balloon > span{color:#fff}
.balloon.pop{animation:pop .35s forwards}
.balloon.fade{opacity:.25;transition:.3s}

/* ---------- opciones ---------- */
.ctx{font-size:1.25rem;line-height:1.5;font-weight:700}
.ctx .emo{font-size:2.2rem;display:block;text-align:center;margin-bottom:6px}
.ask{font-size:1.25rem;font-weight:900;color:#1f2340;background:#fff3bf;border:2px solid #ffd43b;border-radius:14px;padding:8px 16px;margin:14px auto 4px;text-align:center;display:table;max-width:100%}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opts.one{grid-template-columns:1fr}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{background:#f3f4fb;border:3px solid #e3e6f3;border-radius:18px;padding:16px;font-size:1.2rem;font-weight:800;color:var(--ink);text-align:center;transition:transform .1s,border-color .2s;min-height:64px}
.opt:active{transform:scale(.97)}
.opt.sel{border-color:var(--violet);background:#efe9ff}
.opt svg{max-width:100%;height:auto}
.opt .tag{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .12em;font-size:.85em}
.fr span:first-child{border-bottom:.08em solid currentColor;padding:0 .15em .06em}
.fr span:last-child{padding:.06em .15em 0}
sup{font-size:.6em}
.var{font-style:italic;font-family:Georgia,serif}

/* ---------- truco ---------- */
.trick{text-align:center}
.trick .bulb{font-size:4rem;animation:bob 2.4s ease-in-out infinite}
.trick .t{font-size:1.4rem;font-weight:900;margin:8px 0}
.trick .ej{display:inline-block;background:#fff6d6;border-radius:16px;padding:12px 18px;font-size:1.3rem;font-weight:800;margin:10px 0 18px}

/* ---------- laberinto ---------- */
.maze{display:grid;gap:8px;justify-content:center;margin:16px auto}
.cell{width:min(78px,19vw);height:min(78px,19vw);border-radius:16px;background:#eef0fa;font-size:clamp(1.2rem,4.5vw,1.7rem);font-weight:900;color:var(--ink);position:relative;border:3px solid transparent;transition:.15s}
.cell.on{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;transform:scale(1.04)}
.cell.last{border-color:var(--gold)}
.cell.next{border-color:#cdbfff}
.cell .fl{position:absolute;top:-10px;right:-6px;font-size:1.1rem}
.mazebar{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;align-items:center;font-weight:900;font-size:1.2rem}
.sumchip{background:#efe9ff;color:var(--violet);border-radius:999px;padding:8px 16px}
.sumchip.hit{background:#d8f8ea;color:#0f8a63}

/* ---------- balanza ---------- */
.scale{display:flex;flex-direction:column;align-items:center;margin:10px 0}
.beam{width:min(560px,88vw);height:10px;background:#4b4f7a;border-radius:6px;position:relative}
.pans{display:flex;justify-content:space-between;width:min(600px,92vw)}
.pan{width:46%;min-height:96px;background:#f3f4fb;border:3px solid #d6d9ea;border-radius:0 0 60px 60px;border-top:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;padding:10px;font-size:1.8rem}
.wt{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:46px;border-radius:50%;background:#4b4f7a;color:#fff;font-size:1.05rem;font-weight:900;padding:0 6px}
.fulcrum{width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:40px solid #4b4f7a;margin-top:4px}

/* ---------- pirámide / mágico / serie ---------- */
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px;margin:12px 0}
.pyr .r{display:flex;gap:6px}
.blk{width:min(90px,22vw);height:58px;border-radius:12px;background:linear-gradient(135deg,#ffd27a,#ff9f1c);color:#5a3200;font-size:1.5rem;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.blk.q{background:#eef0fa;color:var(--muted)}
.blk.star{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff}
.magic{display:grid;grid-template-columns:repeat(3,min(84px,22vw));gap:6px;justify-content:center;margin:12px 0}
.magic div{height:min(84px,22vw);border-radius:14px;background:#e6f7f5;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;color:#0f6f64}
.magic div.q{background:#eef0fa;color:var(--muted)}
.magic div.star{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff}
.series{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0}
.series div{min-width:64px;height:64px;border-radius:50%;background:#e8f1ff;color:#1d4ed8;font-size:1.4rem;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 8px}
.series div.star{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff}

/* ---------- escape room ---------- */
.locks{display:flex;justify-content:center;gap:18px;margin:12px 0;font-size:3rem}
.locks span{transition:.4s}
.locks .done{filter:drop-shadow(0 0 8px var(--gold))}
.lockcard{border:4px solid #2b2f55;background:#fbfbff}
.esc-head{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.2rem;margin-bottom:8px}

/* ---------- resultados ---------- */
.medal{width:220px;height:260px;margin:0 auto;display:block}
.medalwrap{position:relative;width:280px;height:280px;margin:0 auto}
.medalwrap.oro{--rc:#f5b70a}.medalwrap.plata{--rc:#9fb3c8}.medalwrap.bronce{--rc:#e08a3c}.medalwrap.camino{--rc:#1fb57a}
.rays{position:absolute;left:50%;top:56%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;background:repeating-conic-gradient(var(--rc) 0 10deg,transparent 10deg 20deg);opacity:.45;animation:spin 14s linear infinite;-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%)}
.medalbox{position:relative;animation:medalIn .9s cubic-bezier(.2,1.6,.4,1),glow 1.3s ease-in-out .9s infinite}
.spark{position:absolute;font-size:1.9rem;animation:twinkle 1.3s ease-in-out infinite;z-index:2}
.spark.s1{top:8%;left:2%}.spark.s2{top:18%;right:0;animation-delay:-.4s}.spark.s3{bottom:16%;left:-2%;animation-delay:-.8s}.spark.s4{bottom:4%;right:6%;animation-delay:-.2s}.spark.s5{top:-4%;left:46%;animation-delay:-.6s}.spark.s6{top:52%;right:-8%;animation-delay:-1s}
.funtitle{font-size:clamp(1.6rem,6vw,2.5rem);font-weight:900;line-height:1.1;margin:6px 0 2px;background:linear-gradient(90deg,#ff5fa2,#f5b70a,#14b8a6,#7c5cff,#ff5fa2);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 2.5s linear infinite,beat 1.2s ease-in-out infinite;display:inline-block}
.badge.sup{animation:blinkb 1s ease-in-out infinite}
.exitbtn{border:2px solid rgba(255,255,255,.7);color:#fff;font-size:1rem;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px var(--rc)) brightness(1)}50%{filter:drop-shadow(0 0 30px var(--rc)) brightness(1.2)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(35deg)}}
@keyframes rainbow{to{background-position:300% 0}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes blinkb{50%{box-shadow:0 0 0 7px rgba(31,181,122,.35);transform:scale(1.07)}}
.score{font-size:3.4rem;font-weight:900;margin:6px 0 0}
.badges{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.badge{background:#efe9ff;color:var(--violet);border-radius:999px;padding:8px 16px;font-weight:900}
.badge.sup{background:#d8f8ea;color:#0f8a63}
.bd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
@media(max-width:560px){.bd{grid-template-columns:repeat(2,1fr)}}
.bd div{background:#f3f4fb;border-radius:16px;padding:10px 4px;font-size:.85rem;text-align:center;font-weight:800}
.bd b{display:block;font-size:1.6rem}
.corr{margin-top:16px}
.corr .it{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid #eceef7;align-items:start}
.corr .mk{font-size:1.4rem}
.corr .q{font-weight:800}
.corr .a{color:var(--muted);font-size:.98rem;margin-top:3px}
.corr .a b.ok{color:var(--ok)}
.corr .a b.no{color:var(--bad)}
.corr svg{max-width:220px;height:auto;vertical-align:middle}
.corr .blk,.corr .magic div{width:46px;height:36px;font-size:1rem;border-radius:8px}
.corr .magic{grid-template-columns:repeat(3,46px)}
.corr .series div{min-width:42px;height:42px;font-size:1rem}
.corr .pan{min-height:50px;font-size:1.1rem}.corr .wt{min-width:34px;height:34px;font-size:.8rem}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px}
.codebox{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-size:1.4rem;font-weight:900;letter-spacing:2px;background:#1f2340;color:#fff;border-radius:12px;padding:8px 14px}
.note{font-size:.95rem;color:var(--muted);margin-top:8px}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ---------- profesora ---------- */
textarea{width:100%;min-height:150px;border-radius:14px;border:3px solid #e3e6f3;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:.9rem}
table.ver{width:100%;border-collapse:collapse;margin-top:12px;font-size:.95rem}
table.ver th,table.ver td{padding:8px;border-bottom:1px solid #eceef7;text-align:left}
table.ver tr.okr td:last-child{color:var(--ok);font-weight:900}
table.ver tr.bad td:last-child{color:var(--bad);font-weight:900}
table.ver tr.warn td:last-child{color:#c27300;font-weight:900}



/* ====== FONDOS (interfaz A) ====== */

body.bg1 .top,body.bg1 .logo{text-shadow:0 2px 8px rgba(0,60,120,.45)}

body.bg1 .chip{background:rgba(31,35,64,.35)}
body.bg2{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22380%22%20height%3D%22380%22%3E%3Cg%20font-family%3D%22Comic%20Sans%20MS%2CChalkboard%2Ccursive%22%20font-weight%3D%22700%22%20font-size%3D%2234%22%20opacity%3D%22.55%22%3E%3Ctext%20x%3D%2230%22%20y%3D%2240%22%20fill%3D%22%23ff5fa2%22%20transform%3D%22rotate%28-12%2030%2040%29%22%3E%2B%3C/text%3E%3Ctext%20x%3D%22150%22%20y%3D%2290%22%20fill%3D%22%233b82f6%22%20transform%3D%22rotate%2810%20150%2090%29%22%3E%E2%88%92%3C/text%3E%3Ctext%20x%3D%22260%22%20y%3D%2230%22%20fill%3D%22%23f59f00%22%20transform%3D%22rotate%28-6%20260%2030%29%22%3E%C3%97%3C/text%3E%3Ctext%20x%3D%2290%22%20y%3D%22170%22%20fill%3D%22%2314b8a6%22%20transform%3D%22rotate%288%2090%20170%29%22%3E%C3%B7%3C/text%3E%3Ctext%20x%3D%22210%22%20y%3D%22200%22%20fill%3D%22%237c5cff%22%20transform%3D%22rotate%28-14%20210%20200%29%22%3E%3D%3C/text%3E%3Ctext%20x%3D%22320%22%20y%3D%22140%22%20fill%3D%22%23ff5fa2%22%20transform%3D%22rotate%2812%20320%20140%29%22%3E%CF%80%3C/text%3E%3Ctext%20x%3D%2240%22%20y%3D%22290%22%20fill%3D%22%233b82f6%22%20transform%3D%22rotate%286%2040%20290%29%22%3E%25%3C/text%3E%3Ctext%20x%3D%22170%22%20y%3D%22300%22%20fill%3D%22%23f59f00%22%20transform%3D%22rotate%28-8%20170%20300%29%22%3E%E2%88%9A%3C/text%3E%3Ctext%20x%3D%22290%22%20y%3D%22270%22%20fill%3D%22%2314b8a6%22%20transform%3D%22rotate%284%20290%20270%29%22%3E7%3C/text%3E%3Ctext%20x%3D%22330%22%20y%3D%22330%22%20fill%3D%22%237c5cff%22%20transform%3D%22rotate%28-10%20330%20330%29%22%3E3%3C/text%3E%3C/g%3E%3C/svg%3E"),linear-gradient(rgba(59,130,246,.13) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(59,130,246,.13) 1px,transparent 1px) 0 0/28px 28px,#fffdf4;background-attachment:fixed}
body.bg2::before{content:"";position:fixed;left:56px;top:0;bottom:0;width:3px;background:rgba(255,95,162,.45);opacity:1;background-image:none}
body.bg2 .top,body.bg2 .logo,body.bg2 .teacher-link{color:#2b2f55;text-shadow:none}

function cyrb53(str, seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function RNG(seed){let a=(seed%4294967296)>>>0;const f=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

const lastDig = s => { const m=String(s).match(/(\d)(?!.*\d)/); return m?m[1]:null; };
const isPlainNum = s => /^−?\d+(,\d+)?$/.test(String(s));
function mkOpts(R, ans, cands, n=4, o={}){
  ans = typeof ans==="number"? fmt(ans) : ans;
  const out=[ans], seen=new Set([ans]);
  const same = o.sameLast && isPlainNum(ans), ld = lastDig(ans);
  const num=parseFloat(String(ans).replace("−","-").replace(",","."));
  for(const c of cands){ const k = typeof c==="number"? fmt(c) : c; if(k==null||k==="NaN"||k.includes("NaN")||k.includes("Infinity")) continue;
    if(same && (!isPlainNum(k) || lastDig(k)!==ld)) continue;
    if(same && !o.allowNeg && k.startsWith("−")) continue;
    if(!seen.has(k)){seen.add(k);out.push(k)} if(out.length===n) break; }
  if(same){ const dec=(ans.split(",")[1]||"").length, step=10**(1-dec); let k=1;
    while(out.length<n && k<60){ for(const sg of R.shuffle([1,-1])){ const v=Math.round((num+sg*k*step)*10000)/10000; const t=fmt(v);
      if(out.length<n && !seen.has(t) && (o.allowNeg||v>0) && lastDig(t)===ld){seen.add(t);out.push(t)} } k++; } }
  let i=1;
  while(out.length<n && !isNaN(num)){ for(const d of [i,-i]){ const k=fmt(num+d); if(!seen.has(k)&&out.length<n){seen.add(k);out.push(k)} } i++; }
  return {a:ans, opts:R.shuffle(out)};
}

function genCalc(R, topicId, up, easy){
  let pool = CALC[topicId];
  if(easy && CALC_EASY[topicId]){ const g=R.pick(CALC_EASY[topicId]), r=g(R); const o=mkOpts(R,r.a,r.c,5,{sameLast:!r.noLast,allowNeg:topicId==="ent"||String(r.a).startsWith("−")||(typeof r.a==="number"&&r.a<0)}); return {kind:"calc",sub:r.sub||"",q:r.q,a:o.a,opts:o.opts}; }
  if(LV===1 && CALC_EASY[topicId] && !(up && R.f()<.4)) pool = CALC_EASY[topicId];
  if(LV>=2 && CALC_HARD[topicId]){ const pr = LV===3 ? (up?.85:.6) : (up?.4:0); if(pr && R.f()<pr) pool = CALC_HARD[topicId]; }
  const g = R.pick(pool); const r = g(R);
  const o = mkOpts(R, r.a, r.c, 5, {sameLast:!r.noLast, allowNeg:["ent","ent2","alg","ecu"].includes(topicId)||String(r.a).startsWith("−")||(typeof r.a==="number"&&r.a<0)});
  return {kind:"calc", sub:r.sub||"", q:r.q, a:o.a, opts:o.opts};
}

function genReason(R, curso, T, unl){
  if(T==="estima"||T==="razonable") return genProblem(R,curso,T);
  if(T==="comparar"){ let x=R.pick(COMPARAR)(R); if(R.f()<.5) x={A:x.B,B:x.A,w:x.w==="A"?"B":x.w==="B"?"A":"=",e:x.e};
    return {kind:"choice",ptype:T,emo:"⚖️",ctx:`<b>A:</b> ${x.A} &nbsp;&nbsp;&nbsp; <b>B:</b> ${x.B}`,ask:"Sin hacer la cuenta: ¿cuál es mayor?",a:x.w==="A"?CMP_OPTS[0]:x.w==="B"?CMP_OPTS[1]:CMP_OPTS[2],opts:CMP_OPTS.slice(),fixed:true,exp:x.e}; }
  if(T==="siempre"){ const L=SIEMPRE.filter(x=>!x[3]||curso===2||x[3].some(t=>unl.includes(t))); const x=R.pick(L);
    return {kind:"choice",ptype:T,emo:"🤔",ctx:`«${x[0]}»`,ask:"¿Esto pasa siempre, a veces o nunca?",a:x[1],opts:["Siempre","A veces","Nunca"],fixed:true,exp:x[2]}; }
  if(T==="proporcion"){ const k=LV===1?R.int(0,1)*2:R.int(0,2);
    if(k===0){ const a=R.int(2,5),u=R.int(2,6),b=R.pick([2,3,4,5,6,7,8,9,10].filter(v=>v!==a)); const o=mkOpts(R,b*u,[b*a*u,a*u+b-a,b*u+u,b*u-u]);
      return {kind:"choice",ptype:T,emo:"📒",ctx:`Si ${a} cuadernos cuestan ${a*u} €, ¿cuánto cuestan ${b} cuadernos?`,ask:"Razona (en euros):",a:o.a,opts:o.opts,exp:`Primero 1 cuaderno: ${a*u} : ${a} = ${u} €. Después ${b} · ${u} = ${b*u} €.`}; }
    if(k===1){ const a=R.pick([2,3,4,6]),d=R.pick([4,6,8,12]),b=R.pick([1,2,3,4,6,8,12,24].filter(x=>x!==a&&(a*d)%x===0)),ans=a*d/b; const o=mkOpts(R,ans,[d*b/a,d+(b-a),d,ans+1,ans*2]);
      return {kind:"choice",ptype:T,emo:"🖌️",ctx:`${a} pintores tardan ${d} días en pintar una casa. ¿Cuántos días tardarían ${b} pintores?`,ask:"Razona (en días):",a:o.a,opts:o.opts,exp:`Más pintores tardan menos: hay ${a} · ${d} = ${a*d} días de trabajo; ${a*d} : ${b} = ${fmt(ans)} días.`}; }
    const pp=R.pick([2,4,6]),h=R.int(2,8)*10,q=R.pick([1,3,5,8,10].filter(v=>v!==pp)); const o=mkOpts(R,q*h,[pp*h,q*h+h,q*h-h,pp*h+q]);
    return {kind:"choice",ptype:T,emo:"🍰",ctx:`Una receta para ${pp} personas lleva ${pp*h} g de harina. ¿Cuánta harina hace falta para ${q} personas?`,ask:"Razona (en gramos):",a:o.a,opts:o.opts,exp:`Para 1 persona: ${pp*h} : ${pp} = ${h} g. Para ${q}: ${q} · ${h} = ${q*h} g.`}; }
  if(T==="intruso"){ const k=R.pick(LV===1?[2,5,10]:[2,3,4,5,9]); let ms=new Set(), x;
    const par=R.int(0,1);
    x = k===2 ? 2*R.int(5,40)+1 : k===4 ? 4*R.int(3,20)+2 : k===5||k===10 ? k*R.int(2,15)+R.pick([1,2,3,4,6,7,8,9].filter(v=>(k*0+v)%k!==0)).valueOf() : (()=>{let v;do{v=R.int(11,99)}while(v%k===0||v%2!==par);return v})();
    if(k===10) x = 10*R.int(2,15)+5;
    while(ms.size<3){ let m=k*R.int(2,(k>=9?11:20)); if(k===3||k===9){ if(m%2!==x%2) continue; } if(m!==x) ms.add(m); }
    const all=[...ms,x].map(String); const NM={2:"pares (múltiplos de 2)",3:"múltiplos de 3",4:"múltiplos de 4",5:"múltiplos de 5",9:"múltiplos de 9",10:"múltiplos de 10"};
    return {kind:"choice",ptype:T,emo:"🕵️",ctx:`Tres de estos números tienen algo en común y uno no: ${R.shuffle(all.slice()).join(", ")}.`,ask:"¿Cuál es el intruso?",a:String(x),opts:all,exp:`Todos son ${NM[k]} menos el ${x}.`}; }
}

/* ---------- cálculo razonado: detecta el error / estrategia ---------- */
const NOERR="No hay ningún error";
const ERRORES = [
 R=>{const a=R.int(23,68),b=R.pick([19,29,39,49]);return{c:`${a} + ${b} = ${a} + ${b+1} + 1 = ${a+b+2}`,ok:"Tenía que restar 1, no sumarlo",bad:[`Tenía que sumar ${b-9}`,NOERR,`Tenía que restar ${b+1}`],e:`Compensación: ${b} = ${b+1} − 1, así que ${a} + ${b+1} − 1 = ${a+b}.`}},
 R=>{const n=2*R.int(7,34);return{c:`${n} × 5 = ${n*10} : 5 = ${n*2}`,ok:"Después de ×10 tenía que dividir entre 2",bad:["Tenía que multiplicar por 50",NOERR,"Tenía que dividir entre 10"],e:`×5 es ×10 y la mitad: ${n*10} : 2 = ${n*5}.`}},
 R=>{const n=R.int(13,39);return{c:`${n} × 9 = ${n*10} − 9 = ${n*10-9}`,ok:`Tenía que restar ${n}, no 9`,bad:["Tenía que sumar 9",NOERR,`Tenía que restar 10`],e:`×9 es ×10 menos el número una vez: ${n*10} − ${n} = ${n*9}.`}},
 R=>{const a=R.int(2,9),b=R.int(2,6),c=R.int(2,6);return{c:`${a} + ${b} · ${c} = ${a+b} · ${c} = ${(a+b)*c}`,ok:"Primero hay que multiplicar y después sumar",bad:["Tenía que sumar todo",NOERR,`Tenía que hacer ${a} · ${b} primero`],e:`Primero la multiplicación: ${a} + ${b*c} = ${a+b*c}.`}},
 R=>{const a=R.int(2,9),b=R.int(2,9)+(R.int(0,1)?0:0);if(a===b)return ERRORES[0](R);return{c:`−${a} − ${b} = −${Math.abs(a-b)||1}`.replace("−0","0"),ok:`Tenía que dar −${a+b}: si estás en −${a} y bajas ${b}, bajas más`,bad:[`Tenía que dar ${a+b}`,NOERR,`Tenía que dar ${a-b}`],e:`−${a} − ${b} = −${a+b}. Restar es bajar en la recta numérica.`}},
 R=>{const [x,y]=R.pick([[2,3],[2,5],[3,4],[4,5]]);return{c:`1/${x} + 1/${y} = 2/${x+y}`,ok:"No se suman los denominadores: hay que buscar el mismo denominador",bad:["Tenía que multiplicar los numeradores",NOERR,`Tenía que dar 2/${x*y}`],e:`1/${x} + 1/${y} = ${y}/${x*y} + ${x}/${x*y} = ${x+y}/${x*y}.`}},
 R=>{const x=R.int(102,989)/100;return{c:`${fmt(x)} × 10 = ${fmt(x)}0`,ok:"Al multiplicar por 10 la coma se mueve a la derecha",bad:["Hay que añadir un 0 al principio",NOERR,"Hay que dividir entre 10"],e:`${fmt(x)} × 10 = ${fmt(x*10)}: la coma salta una posición a la derecha.`}},
 R=>{const N=R.int(2,12)*20;return{c:`20 % de ${N} = ${N} : 20 = ${fmt(N/20)}`,ok:"El 20 % es la quinta parte: hay que dividir entre 5",bad:["Hay que multiplicar por 20",NOERR,"Hay que restar 20"],e:`20 % = 20/100 = 1/5 → ${N} : 5 = ${N/5}.`}},
 R=>{const a=R.int(31,78),b=R.int(21,49),u=10-a%10;return{c:`${a} + ${b} = ${a} + ${u} + ${b-u} = ${a+b}`,ok:NOERR,bad:[`Tenía que sumar ${u} dos veces`,`El resultado es ${a+b+10}`,"No se puede descomponer así"],e:`Está bien: descompone ${b} en ${u} + ${b-u} para llegar a la decena.`}},
 R=>{const n=R.int(12,45);return{c:`${n} × 11 = ${n*10} + ${n} = ${n*11}`,ok:NOERR,bad:[`Tenía que sumar 11`,`El resultado es ${n*11+10}`,`Tenía que restar ${n}`],e:`Está bien: ×11 es ×10 y sumar el número una vez.`}}
];
const ESTRATEGIAS = [
 R=>{const a=R.int(23,78),b=R.pick([19,29,39,49,59]);return{q:`${a} + ${b}`,ok:`${a} + ${b+1} − 1`,bad:[`${a} + ${b+1} + 1`,`${a} + ${b} − 1`,`${a+1} + ${b+1}`],e:"Compensación: redondeas a la decena y luego quitas lo que has añadido."}},
 R=>{const a=R.int(150,480),b=R.pick([98,99,97]);return{q:`${a} − ${b}`,ok:`${a} − 100 + ${100-b}`,bad:[`${a} − 100 − ${100-b}`,`${a} + 100 − ${100-b}`,`${a} − ${b} + 100`],e:`Compensación: si restas 100 has quitado ${100-b} de más, así que los vuelves a sumar.`}},
 R=>{const n=2*R.int(7,40);return{q:`${n} × 5`,ok:`${n} × 10 : 2`,bad:[`${n} × 10 × 2`,`${n} : 5`,`${n} × 10 − 5`],e:"×5 es lo mismo que ×10 y dividir entre 2."}},
 R=>{const n=R.int(12,45);return{q:`${n} × 11`,ok:`${n} × 10 + ${n}`,bad:[`${n} × 10 + 1`,`${n} × 10 + 11`,`${n} + 11`],e:"Descomposición: 11 = 10 + 1, así que ×10 y sumas el número una vez."}},
 R=>{const a=R.int(13,48);return{q:`${a} × 12`,ok:`${a} × 10 + ${a} × 2`,bad:[`${a} × 10 + 2`,`${a} × 10 × 2`,`${a} + 10 + 2`],e:"Descomposición: 12 = 10 + 2, multiplicas por cada parte y sumas."}},
 R=>{const m=4*R.int(3,25);return{q:`25 × ${m}`,ok:`${m} : 4 × 100`,bad:[`${m} × 4 × 100`,`${m} : 25 × 100`,`${m} × 4 : 100`],e:"25 es la cuarta parte de 100: divides entre 4 y multiplicas por 100."}},
 R=>{const N=R.int(2,30)*20;return{q:`15 % de ${N}`,ok:`${N/10} + ${N/20}`,bad:[`${N/10} + ${N/10}`,`${N} : 15`,`${N/10} × 5`],e:`15 % = 10 % + 5 %: el 10 % es ${N/10} y el 5 % es su mitad, ${N/20}.`}}
];
function genCalcPlus(R, T){
  if(T==="error"){ const x=R.pick(ERRORES)(R); return {kind:"choice",ptype:T,emo:"✏️",ctx:`Luis ha calculado así: <b>${x.c}</b>`,ask:"¿Dónde está el error?",a:x.ok,opts:R.shuffle([x.ok,...x.bad]),one:true,exp:x.e}; }

}

function svgBarsChart(g){
  const W=300,H=150,n=g.L.length,mx=Math.max(...g.v),bw=Math.min(56,(W-30)/n-14),col=["#a78bfa","#f472b6","#fbbf24","#34d399"];
  let s=`<line x1="22" y1="${H-24}" x2="${W-4}" y2="${H-24}" stroke="#1f2340" stroke-width="2"/>`;
  g.L.forEach((l,i)=>{ const h=Math.max(3,(H-50)*g.v[i]/mx), x=30+i*((W-34)/n)+((W-34)/n-bw)/2, y=H-24-h;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${col[i%4]}"/><text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="13" font-weight="900" fill="#1f2340">${g.v[i]}</text><text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" font-weight="700" fill="#6b7090">${l}</text>`; });
  return `<div class="center"><div style="font-weight:900;margin-bottom:4px">📊 ${g.t}</div><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%">${s}</svg></div>`;
}
function genGrafico(R, curso){
  const g=R.pick(GRAFICOS)(R), tot=g.v.reduce((a,b)=>a+b,0), mxI=g.v.indexOf(Math.max(...g.v)), mnI=g.v.indexOf(Math.min(...g.v));
  let ask,a,c,exp,isTxt=false;
  if(g.bact){ ask="Si sigue igual, ¿cuántas bacterias habrá a los 120 minutos?"; a=16; c=[10,12,9,32]; exp="Cada 30 minutos se duplican: 8 · 2 = 16."; }
  else if(g.pct){ const k=R.int(0,1); if(k){ ask="¿Qué capa ocupa más volumen y cuánto?"; a="El manto, 84 %"; c=["El núcleo, 15 %","La corteza, 1 %","El manto, 15 %"]; isTxt=true; exp="La barra más alta es la del manto (84 %)."; } else { ask="¿Cuánto volumen ocupan entre la corteza y el núcleo?"; a="16 %"; c=["15 %","84 %","100 %"]; isTxt=true; exp="1 % + 15 % = 16 %, o también 100 % − 84 % = 16 %."; } }
  else { const k=R.int(0,3);
    if(k===0){ ask=`¿Cuántos ${g.u} hay en total?`; a=tot; c=[tot+1,tot-1,tot+10,Math.max(...g.v)*g.L.length]; exp=`Suma todas las barras: ${g.v.join(" + ")} = ${tot}.`; }
    else if(k===1){ const i=mxI, j=mnI===mxI?(mxI+1)%g.L.length:mnI; ask=`¿Cuántos ${g.u} más en «${g.L[i]}» que en «${g.L[j]}»?`; a=g.v[i]-g.v[j]; c=[g.v[i]+g.v[j],g.v[i],a+1,a+2]; exp=`${g.v[i]} − ${g.v[j]} = ${a}.`; }
    else if(k===2){ ask="¿Qué barra es la más alta?"; a=g.L[mxI]; c=g.L.filter((_,i)=>i!==mxI&&g.v[i]!==g.v[mxI]); isTxt=true; exp=`«${g.L[mxI]}» tiene ${g.v[mxI]}, más que las demás.`; if(c.length<2){ ask=`¿Cuántos ${g.u} hay en total?`; a=tot; c=[tot+1,tot-1,tot+10]; isTxt=false; exp=`Suma todas las barras: ${tot}.`; } }
    else { const t2=tot; ask=`¿Qué fracción del total es «${g.L[mxI]}»?`; a=fr(g.v[mxI],t2); c=[fr(g.v[mxI],t2+1)+"",`${g.v[mxI]}/${g.L.length}`,fr(t2-g.v[mxI],t2)]; isTxt=true; exp=`${g.v[mxI]} de un total de ${t2} → ${g.v[mxI]}/${t2}${a!==g.v[mxI]+"/"+t2?" = "+a:""}.`; } }
  const o = isTxt ? {a, opts:R.shuffle([a,...[...new Set(c.filter(x=>x!==a))].slice(0,3)])} : mkOpts(R,a,c);
  return {kind:"choice",ptype:"grafico",emo:"📊",ctx:"Observa el gráfico:",chart:svgBarsChart(g),ask,a:o.a,opts:o.opts,exp};
}

function svgBars(kind, v){
  const W=280, pad=10, col=["#a78bfa","#f472b6","#fbbf24","#34d399"];
  const r=(x,y,w,h,f,t)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${f}" stroke="#fff" stroke-width="2"/><text x="${x+w/2}" y="${y+h/2+6}" text-anchor="middle" font-size="16" font-weight="800" fill="#1f2340">${t}</text>`;
  const brace=(x,w,y,t)=>`<path d="M${x} ${y+8} v-6 h${w} v6" fill="none" stroke="#1f2340" stroke-width="2"/><text x="${x+w/2}" y="${y-6}" text-anchor="middle" font-size="17" font-weight="900" fill="#7c5cff">${t}</text>`;
  const lab=(y,t)=>`<text x="4" y="${y+22}" font-size="14" font-weight="800" fill="#6b7090">${t}</text>`;
  let s="", H=110;
  if(kind==="partes"){ const tot=v.a+v.b, L=W-2*pad, wa=Math.max(60,L*v.a/tot), wb=L-wa; s=brace(pad,L,30,"?")+r(pad,42,wa,36,col[0],v.a)+r(pad+wa,42,wb,36,col[1],v.b); H=90; }
  else if(kind==="resta"){ const tot=v.a+v.b, L=W-2*pad, wa=Math.max(60,L*v.a/tot), wb=L-wa; s=brace(pad,L,30,tot)+r(pad,42,wa,36,col[0],v.a)+r(pad+wa,42,wb,36,"#e5e7eb","?"); H=90; }
  else if(kind==="comparacion"){ const L=W-60, wa=L*0.55, wb=L-wa; s=lab(18,v.n1)+r(50,18,wa,34,col[0],v.a)+lab(64,v.n2)+r(50,64,wa,34,col[0],v.a)+r(50+wa,64,wb,34,col[2],"+"+v.b)+`<text x="${W-4}" y="88" text-anchor="end" font-size="18" font-weight="900" fill="#7c5cff">?</text>`; H=110; }
  else if(kind==="veces"){ const L=W-60, u=L/v.n; s=lab(18,v.n1)+r(50,18,u,34,col[0],v.a); for(let i=0;i<v.n;i++) s+=r(50+i*u,64,u,34,col[3],v.a); s+=lab(64,v.n2)+brace(50,L,58,""); s=s.replace(/<text x="[^"]*" y="52"[^>]*><\/text>/,""); s+=`<text x="${W-4}" y="56" text-anchor="end" font-size="18" font-weight="900" fill="#7c5cff">?</text>`; H=110; }
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}

function genMaze(R, neg){
  const N=LV===3?5:4, path=[[0,0]]; let r=0,c=0;
  while(r<N-1||c<N-1){ if(r===N-1)c++; else if(c===N-1)r++; else if(R.f()<.5)r++; else c++; path.push([r,c]); }
  const val=()=>LV===1? R.int(1,5) : neg? R.nz(-5,9) : R.int(1,9);
  const g=[...Array(N)].map(()=>[...Array(N)].map(val));
  const target=path.reduce((s,[a,b])=>s+g[a][b],0);
  return {kind:"maze",ltype:"laberinto",N,grid:g,target,sol:path};
}

/* ======================= SESIÓN ======================= */
function buildSession(ses, curso, seed, nameSeed, nivel=2){
  LV = nivel;
  const R = RNG(seed), Rs = RNG(nameSeed);
  const blk = blkOf(ses), ti = topicIdx(ses), vu = vueltaDe(ses), topics = TOPICS[curso], cur = topics[ti];
  const unl = topics.slice(0, Math.min(5, blk+1)), unlIds = unl.map(t=>t.id);
  const mode = modoDe(ses), mis = misionDe(ses);
  const items = [];
  const TL = TRICKS[cur.id], tr = TL[(vu*6 + (ses-1)%6) % TL.length];
  items.push({kind:"intro", phase:"calc", tit:tr[0], ej:tr[1], topic:cur.name+(vu?" · nivel +":""), mode, mis});
  // cálculo: 2 del tema del bloque + 2 mezclando todo lo que ya saben:
  // temas ya trabajados (nivel normal) y, en 1º, lo que vieron en 6º de Primaria (nivel básico)
  const others = unl.filter(t=>t!==cur).map(t=>({id:t.id,easy:false}))
    .concat(curso===1 ? topics.filter(t=>!unl.includes(t)).map(t=>({id:t.id,easy:true})) : TOPICS[1].map(t=>({id:t.id,easy:LV===1})));
  const calcs = [], wIdx = mode==="parejas" ? -1 : R.int(0,2);
  for(let i=0;i<N_CALC;i++){ const needW = mode==="escribe" ? i<3 : i===wIdx; const o2 = (i<2 || !others.length) ? {id:cur.id,easy:false} : R.pick(others), tid=o2.id; let it, tries=0;
    do { it = Object.assign(genCalc(R,tid,vu>0,o2.easy),{phase:"calc",tid,mode}); tries++; }
    while(tries<25 && (calcs.some(x=>x.q===it.q&&(x.sub||"")===(it.sub||"")) || needW && !writable(it) || mode==="parejas" && badVF(it) || mode==="parejas" && calcs.some(x=>String(x.a)===String(it.a))));
    if(mode==="parejas"){ it.pg = 1; it.pe = 4; }
    if(needW && !writable(it)){ const pool=[{id:cur.id,easy:false}].concat(others); for(let k=0;k<80&&!writable(it);k++){ const o3=R.pick(pool); const c2=Object.assign(genCalc(R,o3.id,vu>0,o3.easy),{phase:"calc",tid:o3.id,mode}); if(writable(c2)&&!calcs.some(x=>x.q===c2.q&&(x.sub||"")===(c2.sub||""))) it=c2; } }
    if(needW && writable(it)) it.write = true;
    else if(mode==="reloj") it.lim = LV===1?25:LV===3?14:18;
    calcs.push(it); }
  const calcPlus = mode!=="parejas" ? Object.assign(genCalcPlus(R, ses%2?"error":"estrategia"),{phase:"calc"}) : null;
  if(calcPlus) calcs[3] = calcPlus;
  R.shuffle(calcs).forEach(c=>items.push(c));
  if(mode==="parejas"){ calcs.length=0; const o2=R.pick(others.length?others:[{id:cur.id,easy:false}]); let it, tries=0;
    do { it = Object.assign(genCalc(R,o2.id,vu>0,o2.easy),{phase:"calc",tid:o2.id,mode:"escribe",write:true}); tries++; }
    while(tries<40 && (!writable(it) || items.some(x=>x.q===it.q&&(x.sub||"")===(it.sub||""))));
    items.push(it); }
  const escape = ses % 5 === 0;
  const COMP = ["falta","piden","pasos","trampa"];
  const RAZ = LV===1?["comparar","siempre","proporcion","razonable","intruso"]:["comparar","siempre","proporcion","razonable","intruso","estima"];
  const raz = R.shuffle(RAZ.slice()).slice(0,2);
  if(!escape){
    const base = LV===1?["operacion","sobra","barras","pregunta","resuelve"]:curso===2?["operacion","sobra","barras","pregunta","resuelve","ecuacion"]:LV===3?["sobra","barras","pregunta","resuelve"]:["operacion","sobra","barras","pregunta","resuelve"];
    if(ses%3===0) genPolya(R,curso).forEach(x=>items.push(Object.assign(x,{phase:"prob"})));
    else { const ptypes = R.shuffle(base.concat(COMP,["grafico"])).slice(0,3);
      ptypes.forEach(t=>items.push(Object.assign(t==="grafico"?genGrafico(R,curso):genProblem(R,curso,t),{phase:"prob"}))); }
    raz.forEach(t=>items.push(Object.assign(genReason(R,curso,t,unlIds),{phase:"reason"})));
    const x = (ses-1) - Math.floor((ses-1)/5);
    const lt1 = LOGIC_ORDER[x % 6], lt2 = LOGIC_ORDER[(x+3) % 6];
    [lt1,lt2].forEach(lt=>items.push(Object.assign(genLogic(R,curso,ses,lt),{phase:"logic"})));
  } else {
    raz.forEach(t=>items.push(Object.assign(genReason(R,curso,t,unlIds),{phase:"reason"})));
    items.push({kind:"escintro", phase:"escape"});
    const l1 = genProblem(R,curso,R.pick(["resuelve","barras","sobra"]));
    const l2 = genProblem(R,curso,R.pick(COMP));
    const l3 = genLogic(R,curso,ses,R.pick(["serie","magico","piramide","balanza","acertijo"]));
    [l1,l2,l3].forEach((x,i)=>items.push(Object.assign(x,{phase:"escape",lock:i})));
  }
  items.forEach(it=>{ if(it.opts && !it.fixed) it.opts = Rs.shuffle(it.opts); });
  if(mode==="parejas") items[1].pairR = Rs.shuffle(items.slice(1,5).map(x=>x.a));
  LV = 2;
  return {ses, curso, escape, topic:cur.name, items, nivel, mode, mis, unl:unl.map(t=>t.name), polya: !escape && ses%3===0};
}
const EJES=[["C","🧮 Cálculo"],["P","🧩 Comprensión"],["R","🤔 Razonamiento"],["L","🧠 Lógica"]];
function ejeDe(x){ return x.phase==="calc"?"C":x.phase==="prob"?"P":x.phase==="reason"?"R":x.phase==="logic"?"L":x.phase==="escape"?(x.lock<2?"P":"L"):null; }
function ejesDe(items, oks){ const t={}; items.forEach((x,i)=>{ const e=ejeDe(x); if(!e||x.kind==="intro"||x.kind==="escintro") return; t[e]=t[e]||[0,0]; t[e][1]++; t[e][0]+=oks[i]===1?1:0; });
  const o={}; EJES.forEach(([k])=>{ o[k]= t[k]? Math.round(t[k][0]/t[k][1]*100)/10 : null; o[k+"n"]=t[k]||[0,0]; }); return o; }

function renderMaze(it){

    const sum=path.reduce((s,[a,b])=>s+it.grid[a][b],0), last=path[path.length-1];

    for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const k=inP(r,c), isLast=r===last[0]&&c===last[1], adj=Math.abs(r-last[0])+Math.abs(c-last[1])===1&&k<0;
      cells+=`<button class="cell ${k>=0?"on":""} ${isLast?"last":""} ${adj?"next":""}" data-r="${r}" data-c="${c}">${fmt(it.grid[r][c])}${r===0&&c===0?'<span class="fl">🚩</span>':""}${r===N-1&&c===N-1?'<span class="fl">🏁</span>':""}</button>`; }
    const atEnd = last[0]===N-1&&last[1]===N-1;
    app.innerHTML = header(it) + `

      <div class="ask">Ve de 🚩 a 🏁 moviéndote a casillas vecinas (↑↓←→). Los números del camino tienen que sumar <span style="font-size:1.5rem">${fmt(it.target)}</span>.</div>
      <div class="maze" style="grid-template-columns:repeat(${N},auto)">${cells}</div>

        <button class="btn gray small" id="undo">↩️ Deshacer</button><button class="btn gray small" id="clr">🧽 Borrar</button></div>
      <div class="actions"><button class="btn green" id="ok" ${atEnd?"":"disabled"}>✅ Entregar camino</button></div>
      <p class="note">Puedes entregar cuando llegues a 🏁.</p>
    </div>`;
    app.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{ const r=+b.dataset.r,c=+b.dataset.c, l=path[path.length-1];
      if(r===l[0]&&c===l[1]&&path.length>1){ path.pop(); return draw(); }
      if(Math.abs(r-l[0])+Math.abs(c-l[1])===1 && inP(r,c)<0){ path.push([r,c]); return draw(); } });

function confetti(N=140){
  const cv=$("confetti"), ctx=cv.getContext("2d"); cv.width=innerWidth; cv.height=innerHeight;
  const cols=["#7c5cff","#ff5fa2","#f5b70a","#14b8a6","#3b82f6","#ff9f1c"];
  const P=[...Array(N)].map(()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,v:2+Math.random()*4,w:6+Math.random()*6,a:Math.random()*6,s:(Math.random()-.5)*.2,c:cols[Math.random()*cols.length|0]}));
  let t=0; (function f(){ ctx.clearRect(0,0,cv.width,cv.height); P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.a+=.05)*1.5;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);ctx.restore();}); if(++t<220) requestAnimationFrame(f); else ctx.clearRect(0,0,cv.width,cv.height); })();
}

 acertijo:"Acertijo",balanza:"Balanza",laberinto:"Laberinto",magico:"Cuadrado mágico",piramide:"Pirámide",serie:"Serie",error:"Detecta el error",estrategia:"¿Qué estrategia usarías?"};
const COMPK=["falta","piden","pasos","trampa","sobra","barras","grafico","operacion","pregunta","resuelve","ecuacion","polya"];
function contenidoSesion(ses, curso, cc, nivs){
  const tn={}; TOPICS[1].concat(TOPICS[2]).forEach(t=>tn[t.id]=t.name);
  const main=TOPICS[cc][topicIdx(ses)].id, rep=new Set(), cal=new Set(), com=new Set(), raz=new Set(), log=new Set(); let wr=0;
  const lvSave=LV;
  for(const lv of nivs){ const S=buildSession(ses,cc,cyrb53(`S${ses}C${curso}N${lv}|${SALT}`),1,lv);
    S.items.forEach(x=>{ if(x.kind==="intro"||x.kind==="escintro") return; const k=x.ptype||x.rtype||x.ltype||x.type;
      if(x.phase==="calc"){ if(x.tid){ if(x.tid!==main) rep.add(tn[x.tid]); } else if(k) cal.add(LBL[k]||k); }
      else if(x.phase==="prob" || (x.phase==="escape" && COMPK.includes(k))) com.add(LBL[k]||k);
      else if(x.phase==="reason") raz.add(LBL[k]||k);
      else log.add(LBL[k]||k); }); }
  LV=lvSave;
  const j=a=>[...a].filter(Boolean).join(", ");
  return `<div class="cont"><div>🧮 <b>Cálculo:</b> ${tn[main]} <span class="muted">(tema del bloque)</span>${rep.size?` + repaso de ${j(rep)}`:""}${cal.size?` · ${j(cal)}`:""} · ✍️ escribir el resultado</div>
  <div>🧩 <b>Comprensión:</b> ${j(com)}</div>${raz.size?`<div>🤔 <b>Razonamiento:</b> ${j(raz)}</div>`:""}<div>🧠 <b>Lógica:</b> ${j(log)}</div></div>`;
}

    g.forEach(([x,i],j)=>{ const good=j<ok; rec.oks[i]=good?1:0; rec.ans[i]= x.kind==="maze"?{sum:good?x.target:x.target+3}:good?x.a:(x.opts||[]).find(o=>o!==x.a); });
    rec.aciertos=ok; rec.total=g.length; rec.nota=Math.round(ok/g.length*100)/10; rec.code=makeCode(nombre,curso,ses,rec.nota);
    const prevR=store.get(offKey(ses-1,curso)); rec.superacion=!!(prevR && rec.nota>prevR.nota); Object.assign(rec, recStats(sess.items, rec.oks));
    store.set(offKey(ses,curso),rec); });
  store.set("rm:perfil",{nombre,grupo,curso}); }
if(DEMO && !store.get("rm:demo")){ seedDemo(); store.set("rm:demo",1); }
function boot(){ if(location.hash.toLowerCase()==="#profe") teacherLogin(); else home(); }
window.addEventListener("hashchange", boot);
document.body.classList.add(THEME==="B"?"tB":"bg1");
sndBtn();
boot();
</script>
